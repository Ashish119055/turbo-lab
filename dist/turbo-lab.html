<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ટર્બોચાર્જર લેબ – 3D Turbocharger Lab (ગુજરાતી / हिन्दी / English)</title>
<meta name="description" content="Interactive 3D turbocharger lab for ITI trainees in Gujarati, Hindi and English: all parts, cut section, working animation, lubrication and cooling system, dismantling, failure lab, theory, materials and MCQ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Turbocharger Lab — ITI Lab Gujarati */
:root {
  --bg: #eef1f4; --bg-2: #e2e7ec; --panel: #ffffff; --ink: #13202c; --ink-2: #566575; --line: #cfd7df;
  --accent: #d97400; --accent-ink: #ffffff; --signal: #0a7db4; --ok: #188a48; --bad: #d0261f; --warn: #b88600;
  --air: #1f8fe0; --exh: #e2452a; --oil: #c98a00; --cool: #12a594;
  --shadow: 0 1px 2px rgba(19,32,44,.08), 0 8px 24px rgba(19,32,44,.06);
  --f-display: "Barlow Condensed", "Noto Sans Gujarati", "Noto Sans Devanagari", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", "Noto Sans Gujarati", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.fsx { position: fixed; inset: 0; overflow: auto; z-index: 100; }
#app:fullscreen { overflow: auto; background: var(--bg); }
#app:-webkit-full-screen { overflow: auto; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; line-height: 1.2; }
h2 { font-size: 21px; } h3 { font-size: 17px; }
p { margin: 6px 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 36px; height: 36px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.15; }
.brand-sub { font-size: 12px; color: var(--ink-2); }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-weight: 600; font-size: 14px; min-height: 36px; }
.seg button[aria-checked="true"] { background: var(--ink); color: #fff; }
.fs-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; min-height: 36px; white-space: nowrap; }
.fs-btn:hover { border-color: var(--accent); }

.tabs { display: flex; gap: 2px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); padding: 0 8px; position: sticky; top: 0; z-index: 20; scrollbar-width: thin; }
.tabs button { border: 0; background: transparent; padding: 11px 12px; font-weight: 600; font-size: 14px; white-space: nowrap; color: var(--ink-2); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding: 12px; max-width: 1280px; margin: 0 auto; }
.page { max-width: 980px; margin: 0 auto; }
.bench { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 12px; align-items: start; }
@media (max-width: 860px) { .bench { grid-template-columns: 1fr; } main { padding: 8px; } }

.stage { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.viewport { position: relative; height: clamp(330px, 80vw, 540px); background: radial-gradient(120% 90% at 50% 20%, #2b3a49 0%, #121a22 70%, #0b1016 100%); touch-action: none; overflow: hidden; }
.viewport canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; transform: translate(-50%, -50%); background: rgba(255,255,255,.93); color: #13202c; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 10px; white-space: nowrap; border: 1.5px solid var(--accent); line-height: 1.5; }
.albl { position: absolute; transform: translate(-50%, -50%); font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 10px; white-space: nowrap; color: #fff; pointer-events: none; line-height: 1.6; }
.albl.air { background: #1e88e5; } .albl.exh { background: #e5482b; } .albl.oil { background: #b07a00; } .albl.cool { background: #0e8a7b; }
.hint { position: absolute; left: 8px; bottom: 6px; right: 8px; color: #b9c6d2; font-size: 11.5px; pointer-events: none; text-shadow: 0 1px 2px #000; }
.alert { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff; font-weight: 700; padding: 4px 12px; border-radius: 20px; font-size: 13px; animation: blink 1s infinite; white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
@keyframes blink { 50% { opacity: .55; } }
.pinfo { position: absolute; left: 8px; top: 8px; max-width: min(330px, 78%); background: rgba(255,255,255,.96); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px 28px 8px 10px; font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); }
.pinfo b { font-size: 15px; display: block; }
.pinfo .m { color: var(--signal); font-weight: 600; }
.pinfo .x { position: absolute; right: 4px; top: 2px; border: 0; background: none; font-size: 18px; padding: 4px 8px; }
.tour { background: #fff7e8; padding: 9px 12px; border-top: 4px solid var(--accent); }
.tour-txt { font-size: 14.5px; font-weight: 500; }
.tour-nav { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 6px; }
.tour-nav button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; min-width: 42px; min-height: 34px; font-weight: 700; }
.tour-nav span { font-size: 12px; color: var(--ink-2); margin-right: auto; }

.toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
.tb { border: 1.5px solid var(--line); background: var(--bg); border-radius: 18px; padding: 5px 11px; font-size: 13px; font-weight: 600; min-height: 34px; white-space: nowrap; }
.tb[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tb.air[aria-pressed="true"] { background: var(--air); border-color: var(--air); }
.tb.exh[aria-pressed="true"] { background: var(--exh); border-color: var(--exh); }
.tb.oil[aria-pressed="true"] { background: var(--oil); border-color: var(--oil); }
.tb.cool[aria-pressed="true"] { background: var(--cool); border-color: var(--cool); }
.tb.go { background: var(--accent); color: #fff; border-color: var(--accent); }

.drive { padding: 8px 10px 10px; border-top: 1px solid var(--line); background: #f7f9fb; }
.thr { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13.5px; }
.thr input { flex: 1; accent-color: var(--accent); min-width: 80px; height: 28px; }
.thr b { min-width: 44px; text-align: right; font-family: var(--f-display); font-size: 18px; }
.gauges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
@media (max-width: 520px) { .gauges { grid-template-columns: repeat(2, 1fr); } }
.g { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; min-width: 0; }
.g small { display: block; font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g b { font-family: var(--f-display); font-size: 20px; line-height: 1.15; }
.g i { font-style: normal; font-size: 11px; color: var(--ink-2); margin-left: 3px; }
.g .bar { height: 5px; background: var(--bg-2); border-radius: 3px; margin-top: 3px; overflow: hidden; }
.g .bar span { display: block; height: 100%; width: 0; background: var(--signal); border-radius: 3px; }
.g.bad { border-color: var(--bad); background: #fff3f2; } .g.bad b { color: var(--bad); }
.g.bad .bar span { background: var(--bad); }

.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); }
.card > h3 { margin-bottom: 6px; }
.card ul, .card ol { margin: 6px 0; padding-left: 20px; }
.card li { margin: 3px 0; }
.muted { color: var(--ink-2); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--bg); border-radius: 16px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; min-height: 32px; }
.chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn { border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 14px; font-weight: 600; min-height: 38px; }
.btn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { background: #fff7e8; border-left: 4px solid var(--accent); padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 14px; }
.note.red { background: #fff0ef; border-left-color: var(--bad); }
.note.green { background: #ecf8f0; border-left-color: var(--ok); }
.note.blue { background: #eaf5fb; border-left-color: var(--signal); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 10px; background: var(--bg-2); margin-right: 4px; }
.tag.t-air { background: #dceefb; color: #0b5e9c; } .tag.t-exh { background: #fde2dc; color: #a12813; }
.tag.t-oil { background: #fcefc7; color: #7a5400; } .tag.t-cool { background: #d5f3ee; color: #0b6d61; }

/* steps */
.card ol.steps, .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.steps li { border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); cursor: pointer; }
.steps li.cur { border-color: var(--accent); background: #fff7e8; }
.steps li.done { opacity: .6; }
.steps li b { display: block; }
.steps li .d { font-size: 13.5px; display: none; margin-top: 4px; }
.steps li.cur .d { display: block; }
.steps .tool { color: var(--signal); font-weight: 600; font-size: 13px; }
.steps .warn { color: var(--bad); font-weight: 600; font-size: 13px; }

/* tables */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--bg-2); font-weight: 700; }
td.c { text-align: center; }

/* parts grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; border-top: 4px solid var(--sw, var(--accent)); }
.pcard h3 { display: flex; gap: 6px; align-items: baseline; }
.pcard h3 small { font-size: 12px; color: var(--ink-2); font-family: var(--f-body); font-weight: 500; }
.pcard .no { background: var(--ink); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: 13px; flex: none; }
.pcard dl { margin: 6px 0 8px; font-size: 13.5px; }
.pcard dt { font-weight: 700; color: var(--ink-2); font-size: 11.5px; text-transform: uppercase; margin-top: 5px; }
.pcard dd { margin: 0; }

/* system svg */
.sysbox { background: #fff; border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.sysbox svg { display: block; min-width: 660px; width: 100%; height: auto; }
.flow { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.flow.d { stroke-width: 3; stroke: #fff; stroke-dasharray: 3 13; animation: dash 1s linear infinite; opacity: .9; }
@keyframes dash { to { stroke-dashoffset: -16; } }
.lay { transition: opacity .25s; } .lay.off { opacity: .1; }
.node { cursor: pointer; } .node rect, .node circle, .node path { transition: stroke-width .15s; }
.node.sel rect, .node.sel circle { stroke: #13202c; stroke-width: 3.5; }
.node text { font-family: var(--f-body); font-size: 13px; font-weight: 700; pointer-events: none; }

/* fault */
.flist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.dial { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.dial svg { width: 150px; height: 150px; flex: none; }
.res-ok { color: var(--ok); font-weight: 700; } .res-bad { color: var(--bad); font-weight: 700; }

/* theory */
details.th { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 8px; overflow: hidden; }
details.th > summary { padding: 11px 14px; font-family: var(--f-display); font-weight: 700; font-size: 18px; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details.th > summary::-webkit-details-marker { display: none; }
details.th > summary::after { content: "+"; margin-left: auto; font-size: 22px; color: var(--accent); }
details.th[open] > summary::after { content: "–"; }
details.th > div { padding: 0 14px 12px; }
details.th ul, details.th ol { padding-left: 20px; margin: 6px 0; } details.th li { margin: 4px 0; }
.fig { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px; margin: 8px 0; text-align: center; }
.fig svg { max-width: 100%; height: auto; }
.fig figcaption, .fig .cap { font-size: 12.5px; color: var(--ink-2); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 12px; font-size: 13px; text-align: left; padding: 4px 8px; }
.kw { background: #fff3c4; padding: 0 4px; border-radius: 4px; font-weight: 600; }

/* mcq */
.q { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; }
.q .qt { font-weight: 600; margin-bottom: 8px; }
.q .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
@media (max-width: 560px) { .q .opts { grid-template-columns: 1fr; } }
.q .opts button { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
.q .opts button.right { background: #dff5e6; border-color: var(--ok); font-weight: 700; }
.q .opts button.wrong { background: #fde3e1; border-color: var(--bad); }
.q .ex { margin-top: 8px; font-size: 13.5px; background: #eaf5fb; border-radius: 6px; padding: 6px 10px; }
.score { position: sticky; top: 46px; z-index: 10; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; }
.score button { border: 0; border-radius: 6px; padding: 5px 10px; background: var(--accent); color: #fff; font-weight: 700; }

.foot { text-align: center; color: var(--ink-2); font-size: 12.5px; padding: 14px 12px 18px; }

</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <g stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" fill="none">
        <path d="M20 20c0-6 3-9 7-10"/><path d="M20 20c5 3 6 7 5 11"/><path d="M20 20c-5 3-9 2-12-1"/>
      </g>
      <circle cx="20" cy="20" r="3" fill="currentColor"/>
    </svg>
    <div>
      <div class="brand-name" data-t="brand"></div>
      <div class="brand-sub" data-t="sub"></div>
    </div>
  </div>
  <div class="top-actions">
    <div class="seg" id="langSeg" role="radiogroup" aria-label="ભાષા / भाषा / Language">
      <button data-lang="0">ગુજ</button><button data-lang="1">हिं</button><button data-lang="2">EN</button>
    </div>
    <button class="fs-btn" id="fsBtn"></button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections"></nav>

<main>
  <section class="view" id="view-lab" hidden>
    <div class="bench">
      <div class="stage-slot" data-slot="lab"></div>
      <aside class="side" id="labSide"></aside>
    </div>
  </section>

  <section class="view" id="view-parts" hidden><div class="page" id="partsPage"></div></section>

  <section class="view" id="view-dis" hidden>
    <div class="bench">
      <div class="stage-slot" data-slot="dis"></div>
      <aside class="side" id="disSide"></aside>
    </div>
  </section>

  <section class="view" id="view-sys" hidden><div class="page" id="sysPage"></div></section>

  <section class="view" id="view-fault" hidden>
    <div class="bench">
      <div class="stage-slot" data-slot="fault"></div>
      <aside class="side" id="faultSide"></aside>
    </div>
    <div class="page" id="faultPage"></div>
  </section>

  <section class="view" id="view-theory" hidden><div class="page" id="theoryPage"></div></section>
  <section class="view" id="view-mcq" hidden><div class="page" id="mcqPage"></div></section>
</main>

<!-- shared 3D stage: moved into the active view -->
<div class="stage" id="stage">
  <div class="viewport" id="viewport">
    <div id="labels"></div>
    <div class="hint" id="hint"></div>
    <div class="alert" id="alert" hidden></div>
    <div class="pinfo" id="pinfo" hidden></div>
  </div>
  <div class="tour" id="tour" hidden>
    <div class="tour-txt" id="tourTxt"></div>
    <div class="tour-nav"><button id="tourPrev">◀</button><span id="tourNo"></span><button id="tourNext">▶</button><button id="tourEnd">✕</button></div>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div class="drive" id="drive">
    <label class="thr"><span id="thrLbl"></span><input type="range" id="thr" min="0" max="100" value="35"><b id="thrVal">35%</b></label>
    <div class="gauges" id="gauges"></div>
  </div>
</div>

<footer class="foot" id="foot">
  <div data-t="spec_note"></div>
  <div><b>ITI Lab Gujarati</b> · itilabgujarati.blogspot.com</div>
</footer>
</div>

    '<li><b>એક્સિલરેટર</b> સ્લાઇડર ખસેડો – ટર્બો સ્પીડ અને બૂસ્ટ વધતા જુઓ. (બૂસ્ટ મોડું આવે છે = <span class="kw">ટર્બો લેગ</span>)</li><li><b>✂️ કટ સેક્શન</b> દબાવો – અંદરના વ્હીલ, શાફ્ટ, બેરિંગ દેખાશે.</li><li><b>🌬️ હવા / 🔥 એક્ઝોસ્ટ / 🛢️ ઓઇલ / 💧 કૂલન્ટ</b> – દરેકનો રસ્તો અલગ રંગમાં જુઓ.</li><li>કોઈ પણ <b>પાર્ટ પર ટચ</b> કરો – નામ, કામ અને મટીરિયલ આવશે.</li><li>ફુલ એક્સિલરેટર આપો – <b>વેસ્ટગેટ</b> આપોઆપ ખૂલતો જુઓ.</li>',
    '<li><b>एक्सीलरेटर</b> स्लाइडर खिसकाओ – टर्बो स्पीड और बूस्ट बढ़ते देखो। (बूस्ट देर से आता है = <span class="kw">टर्बो लैग</span>)</li><li><b>✂️ कट सेक्शन</b> दबाओ – अंदर के व्हील, शाफ्ट, बेयरिंग दिखेंगे।</li><li><b>🌬️ हवा / 🔥 एग्जॉस्ट / 🛢️ ऑयल / 💧 कूलेंट</b> – हर एक का रास्ता अलग रंग में देखो।</li><li>किसी भी <b>पार्ट पर टच</b> करो – नाम, काम और मटीरियल आएगा।</li><li>फुल एक्सीलरेटर दो – <b>वेस्टगेट</b> अपने आप खुलता देखो।</li>',
    '<li>Move the <b>accelerator</b> slider – watch turbo speed and boost rise. (Boost arrives late = <span class="kw">turbo lag</span>)</li><li>Press <b>✂️ Cut section</b> – see the wheels, shaft and bearings inside.</li><li><b>🌬️ Air / 🔥 Exhaust / 🛢️ Oil / 💧 Coolant</b> – follow each path in its own colour.</li><li><b>Tap any part</b> – name, job and material appear.</li><li>Give full accelerator – watch the <b>wastegate</b> open by itself.</li>'],
  basic_h: ['યાદ રાખો (પાયાના શબ્દો)', 'याद रखो (बुनियादी शब्द)', 'Remember (basic terms)'],
  basic_p: [
    '<li><b>ટર્બાઇન</b> = એક્ઝોસ્ટ ગેસથી ફરતું વ્હીલ (ગરમ બાજુ 🔴)</li><li><b>કમ્પ્રેસર</b> = હવા દબાવતું વ્હીલ (ઠંડી બાજુ 🔵)</li><li><b>બૂસ્ટ</b> = વાતાવરણ કરતાં વધારાનું હવાનું દબાણ</li><li><b>વેસ્ટગેટ</b> = વધારાનો ગેસ બહાર કાઢતો વાલ્વ</li><li><b>CHRA</b> = વચ્ચેનું બેરિંગ હાઉસિંગ + ફરતા ભાગ</li>',
    '<li><b>टर्बाइन</b> = एग्जॉस्ट गैस से घूमने वाला व्हील (गरम साइड 🔴)</li><li><b>कंप्रेसर</b> = हवा दबाने वाला व्हील (ठंडी साइड 🔵)</li><li><b>बूस्ट</b> = वातावरण से ज़्यादा हवा का दबाव</li><li><b>वेस्टगेट</b> = ज़्यादा गैस बाहर निकालने वाला वाल्व</li><li><b>CHRA</b> = बीच का बेयरिंग हाउसिंग + घूमने वाले पार्ट</li>',
    '<li><b>Turbine</b> = wheel turned by exhaust gas (hot side 🔴)</li><li><b>Compressor</b> = wheel that squeezes air (cold side 🔵)</li><li><b>Boost</b> = air pressure above atmospheric</li><li><b>Wastegate</b> = valve that lets extra gas escape</li><li><b>CHRA</b> = centre bearing housing + rotating parts</li>'],

  asm_note: ['<b>ફિટિંગ = ઊંધો ક્રમ.</b> નવી રિપેર કિટ (બેરિંગ, સીલ, થ્રસ્ટ) વાપરો, માર્કિંગ મેળવો, અને રોટર <b>બેલેન્સ</b> કરાવ્યા વગર ટર્બો ફિટ ન કરો. ફિટ કરતાં પહેલાં ઓઇલ ઇનલેટમાં સ્વચ્છ ઓઇલ ભરો (પ્રી-લ્યુબ).', '<b>फिटिंग = उल्टा क्रम।</b> नई रिपेयर किट (बेयरिंग, सील, थ्रस्ट) लगाओ, मार्किंग मिलाओ, और रोटर <b>बैलेंस</b> कराए बिना टर्बो फिट मत करो। फिट करने से पहले ऑयल इनलेट में साफ़ ऑयल भरो (प्री-ल्यूब)।', '<b>Assembly = reverse order.</b> Use a new repair kit (bearings, seals, thrust), align the match marks and never fit a turbo without <b>balancing</b> the rotor. Fill the oil inlet with clean oil before fitting (pre-lube).'],

  sys_p: ['રંગના બટનથી લાઇન ચાલુ/બંધ કરો. કોઈ પણ બોક્સ પર ટચ કરો – તેનું કામ નીચે આવશે.', 'रंग के बटन से लाइन चालू/बंद करो। किसी भी बॉक्स पर टच करो – उसका काम नीचे आएगा।', 'Use the colour buttons to switch each circuit. Tap any box to read its job.'],

  act_p: [
    '<li>ડબ્બીની અંદર રબરનું <b>ડાયાફ્રામ</b> અને <b>સ્પ્રિંગ</b> છે. સ્પ્રિંગ વેસ્ટગેટને <b>બંધ</b> દબાવી રાખે.</li><li>કમ્પ્રેસરનું <b>બૂસ્ટ પ્રેશર</b> પાતળી હોઝથી ડાયાફ્રામની એક બાજુ આવે.</li><li>બૂસ્ટ સ્પ્રિંગના જોર (≈ 1.1 bar) કરતાં વધે → ડાયાફ્રામ ખસે → <b>રોડ</b> ધકેલાય → વેસ્ટગેટ <b>ખૂલે</b>.</li><li>થોડો ગેસ ટર્બાઇનને બાયપાસ કરે → ટર્બો ધીમો પડે → બૂસ્ટ ઘટે → સ્પ્રિંગ ફરી બંધ કરે. આમ બૂસ્ટ <b>આપોઆપ કાબૂમાં</b> રહે.</li>',
    '<li>डिब्बी के अंदर रबर का <b>डायाफ्राम</b> और <b>स्प्रिंग</b> है। स्प्रिंग वेस्टगेट को <b>बंद</b> दबाए रखती है।</li><li>कंप्रेसर का <b>बूस्ट प्रेशर</b> पतली होज़ से डायाफ्राम की एक तरफ़ आता है।</li><li>बूस्ट स्प्रिंग के ज़ोर (≈ 1.1 bar) से बढ़े → डायाफ्राम खिसकता है → <b>रॉड</b> धकेली जाती है → वेस्टगेट <b>खुलता</b> है।</li><li>थोड़ी गैस टर्बाइन को बायपास करती है → टर्बो धीमा होता है → बूस्ट घटता है → स्प्रिंग फिर बंद करती है। इस तरह बूस्ट <b>अपने आप काबू में</b> रहता है।</li>',
    '<li>Inside the can are a rubber <b>diaphragm</b> and a <b>spring</b>. The spring holds the wastegate <b>shut</b>.</li><li><b>Boost pressure</b> from the compressor reaches one side of the diaphragm through a thin hose.</li><li>Boost beats the spring (≈ 1.1 bar) → the diaphragm moves → the <b>rod</b> is pushed → the wastegate <b>opens</b>.</li><li>Some gas bypasses the turbine → the turbo slows → boost falls → the spring closes it again. So boost <b>controls itself</b>.</li>'],

  { id: 'actuator', sw: '#c9a227', n: ['એક્ચ્યુએટર + રોડ', 'एक्चुएटर + रॉड', 'Actuator + rod'],

  { set: { exh: 1 }, thr: 45, t: ['<b>1.</b> એન્જિનમાંથી ગરમ <b>એક્ઝોસ્ટ ગેસ</b> (600–900°C) 🔴 ટર્બાઇન હાઉસિંગમાં આવે છે. આ ગેસ આમ તો નકામો જાય – ટર્બો તેની તાકાત વાપરે છે.', '<b>1.</b> इंजन से गरम <b>एग्जॉस्ट गैस</b> (600–900°C) 🔴 टर्बाइन हाउसिंग में आती है। यह गैस वैसे बेकार जाती – टर्बो उसकी ताक़त इस्तेमाल करता है।', '<b>1.</b> Hot <b>exhaust gas</b> (600–900°C) 🔴 from the engine enters the turbine housing. It would be wasted – the turbo uses its energy.'] },
  { set: { exh: 1, cut: 1, slow: 1 }, thr: 45, t: ['<b>2.</b> ગોકળગાય જેવો રસ્તો સાંકડો થતો જાય, એટલે ગેસની ઝડપ વધે અને તે <b>ટર્બાઇન વ્હીલ</b> ને ફેરવે.', '<b>2.</b> घोंघे जैसा रास्ता सँकरा होता जाता है, इसलिए गैस की रफ़्तार बढ़ती है और वह <b>टर्बाइन व्हील</b> को घुमाती है।', '<b>2.</b> The snail passage narrows, the gas speeds up and spins the <b>turbine wheel</b>.'] },
  { set: { cut: 1, slow: 1 }, thr: 45, t: ['<b>3.</b> ટર્બાઇન વ્હીલ અને કમ્પ્રેસર વ્હીલ <b>એક જ શાફ્ટ</b> પર છે. એક ફરે એટલે બીજું પણ એટલી જ ઝડપે ફરે.', '<b>3.</b> टर्बाइन व्हील और कंप्रेसर व्हील <b>एक ही शाफ्ट</b> पर हैं। एक घूमे तो दूसरा भी उतनी ही रफ़्तार से घूमता है।', '<b>3.</b> Turbine wheel and compressor wheel sit on <b>one shaft</b>. When one turns, the other turns at the same speed.'] },
  { set: { air: 1, cut: 1 }, thr: 60, t: ['<b>4.</b> <b>કમ્પ્રેસર વ્હીલ</b> બહારની તાજી હવા 🔵 વચ્ચેથી ખેંચે, અને દબાવીને બહાર ધકેલે. આ વધારાનું દબાણ = <b>બૂસ્ટ</b>.', '<b>4.</b> <b>कंप्रेसर व्हील</b> बाहर की ताज़ी हवा 🔵 बीच से खींचता है, और दबाकर बाहर धकेलता है। यह अतिरिक्त दबाव = <b>बूस्ट</b>।', '<b>4.</b> The <b>compressor wheel</b> draws fresh air 🔵 in at the centre, squeezes it and pushes it out. That extra pressure = <b>boost</b>.'] },
  { set: { air: 1, exh: 1 }, thr: 70, t: ['<b>5.</b> દબાયેલી હવા ગરમ થાય, એટલે <b>ઇન્ટરકૂલર</b> તેને ઠંડી કરે. પછી એન્જિનમાં: <b>વધુ હવા + વધુ ડીઝલ = વધુ પાવર</b>.', '<b>5.</b> दबी हुई हवा गरम होती है, इसलिए <b>इंटरकूलर</b> उसे ठंडा करता है। फिर इंजन में: <b>ज़्यादा हवा + ज़्यादा डीज़ल = ज़्यादा पावर</b>।', '<b>5.</b> Compressed air gets hot, so the <b>intercooler</b> cools it. Then into the engine: <b>more air + more diesel = more power</b>.'] },
  { set: { oil: 1, cut: 1, slow: 1 }, thr: 50, t: ['<b>6.</b> શાફ્ટ <b>ઓઇલની પાતળી ફિલ્મ</b> પર તરે છે 🟡. એન્જિન ઓઇલ ઉપરથી પ્રેશરથી આવે, બેરિંગને ચીકણા અને ઠંડા કરે, અને નીચેથી સમ્પમાં પાછું જાય.', '<b>6.</b> शाफ्ट <b>ऑयल की पतली फिल्म</b> पर तैरता है 🟡। इंजन ऑयल ऊपर से प्रेशर से आता है, बेयरिंग को चिकना और ठंडा करता है, और नीचे से संप में वापस जाता है।', '<b>6.</b> The shaft floats on a <b>thin film of oil</b> 🟡. Engine oil comes in at the top under pressure, lubricates and cools the bearings and drains back to the sump at the bottom.'] },
  { set: { cool: 1, cut: 1 }, thr: 50, t: ['<b>7.</b> <b>કૂલન્ટ</b> 🟢 બેરિંગ હાઉસિંગના વોટર જેકેટમાં ફરી ગરમી લઈ જાય – જેથી ઓઇલ બળી ન જાય.', '<b>7.</b> <b>कूलेंट</b> 🟢 बेयरिंग हाउसिंग के वॉटर जैकेट में घूमकर गर्मी ले जाता है – ताकि ऑयल जले नहीं।', '<b>7.</b> <b>Coolant</b> 🟢 flows through the water jacket of the bearing housing and carries heat away – so the oil does not burn.'] },
  { set: { exh: 1, air: 1 }, thr: 100, t: ['<b>8.</b> ફુલ એક્સિલરેટર! બૂસ્ટ લિમિટે પહોંચે એટલે <b>વેસ્ટગેટ</b> ખૂલે – થોડો ગેસ ટર્બાઇનને અડ્યા વગર નીકળી જાય, અને ટર્બોની ઝડપ કાબૂમાં રહે.', '<b>8.</b> फुल एक्सीलरेटर! बूस्ट लिमिट पर पहुँचते ही <b>वेस्टगेट</b> खुलता है – थोड़ी गैस टर्बाइन को छुए बिना निकल जाती है, और टर्बो की रफ़्तार काबू में रहती है।', '<b>8.</b> Full accelerator! When boost reaches its limit the <b>wastegate</b> opens – some gas escapes without touching the turbine, keeping turbo speed under control.'] }
];

TL.SYS = {
  filter: [['એર ફિલ્ટર', 'एयर फिल्टर', 'Air filter'], ['બહારની હવામાંથી ધૂળ ગાળે. જામ હોય તો ટર્બોને હવા ઓછી મળે અને સીલમાંથી ઓઇલ ખેંચાય. ફાટેલું હોય તો ધૂળ કમ્પ્રેસર બ્લેડ ઘસી નાખે.', 'बाहर की हवा से धूल छानता है। जाम हो तो टर्बो को हवा कम मिलती है और सील से ऑयल खिंचता है। फटा हो तो धूल कंप्रेसर ब्लेड घिस देती है।', 'Removes dust from outside air. If clogged, the turbo starves and pulls oil past its seal. If torn, dust erodes the compressor blades.']],
  comp: [['કમ્પ્રેસર', 'कंप्रेसर', 'Compressor'], ['હવાને દબાવે (બૂસ્ટ ≈ 0.8–1.5 bar). દબાવવાથી હવા 120–180°C સુધી ગરમ થાય.', 'हवा को दबाता है (बूस्ट ≈ 0.8–1.5 bar)। दबाने से हवा 120–180°C तक गरम होती है।', 'Compresses the air (boost ≈ 0.8–1.5 bar). Compression heats it to 120–180°C.']],
  ic: [['ઇન્ટરકૂલર', 'इंटरकूलर', 'Intercooler'], ['હવાનું રેડિયેટર. ગરમ દબાયેલી હવાને ≈ 50°C સુધી ઠંડી કરે. ઠંડી હવા <b>ઘટ્ટ</b> હોય – એટલી જ જગ્યામાં વધારે ઓક્સિજન. ફાયદા: વધુ પાવર, ઓછું NOx, એન્જિન ઠંડું.', 'हवा का रेडिएटर। गरम दबी हवा को ≈ 50°C तक ठंडा करता है। ठंडी हवा <b>घनी</b> होती है – उतनी ही जगह में ज़्यादा ऑक्सीजन। फायदे: ज़्यादा पावर, कम NOx, इंजन ठंडा।', 'A radiator for air. Cools the hot compressed air to ≈ 50°C. Cool air is <b>denser</b> – more oxygen in the same space. Gains: more power, less NOx, cooler engine.']],
  engine: [['એન્જિન', 'इंजन', 'Engine'], ['વધારે હવા મળે એટલે વધારે ડીઝલ પૂરું બળે → વધુ પાવર, ઓછો ધુમાડો. એન્જિન જ ટર્બોને ઓઇલ અને કૂલન્ટ આપે છે.', 'ज़्यादा हवा मिलने पर ज़्यादा डीज़ल पूरा जलता है → ज़्यादा पावर, कम धुआँ। इंजन ही टर्बो को ऑयल और कूलेंट देता है।', 'More air lets more diesel burn completely → more power, less smoke. The engine also supplies the turbo with oil and coolant.']],
  turb: [['ટર્બાઇન', 'टर्बाइन', 'Turbine'], ['એક્ઝોસ્ટ ગેસની ગરમી અને ઝડપમાંથી તાકાત લઈ શાફ્ટ ફેરવે. ગેસ અહીં 600–900°C હોય.', 'एग्जॉस्ट गैस की गर्मी और रफ़्तार से ताक़त लेकर शाफ्ट घुमाता है। गैस यहाँ 600–900°C होती है।', 'Takes energy from the heat and speed of the exhaust gas to turn the shaft. Gas here is 600–900°C.']],
  chra: [['બેરિંગ હાઉસિંગ (CHRA)', 'बेयरिंग हाउसिंग (CHRA)', 'Bearing housing (CHRA)'], ['અહીં શાફ્ટ ઓઇલ ફિલ્મ પર ફરે. <b>ઓઇલ ઉપરથી અંદર, નીચેથી બહાર</b>. કૂલન્ટ આસપાસ ફરે. ઓઇલનાં 3 કામ: ચીકાશ, ઠંડક, અને શાફ્ટને તરતી રાખવી.', 'यहाँ शाफ्ट ऑयल फिल्म पर घूमता है। <b>ऑयल ऊपर से अंदर, नीचे से बाहर</b>। कूलेंट चारों ओर घूमता है। ऑयल के 3 काम: चिकनाई, ठंडक, और शाफ्ट को तैरता रखना।', 'Here the shaft runs on an oil film. <b>Oil in at the top, out at the bottom</b>. Coolant circulates around it. Oil has 3 jobs: lubricate, cool, and float the shaft.']],
  sil: [['સાયલેન્સર / એક્ઝોસ્ટ', 'साइलेंसर / एग्जॉस्ट', 'Silencer / exhaust'], ['ટર્બાઇનમાંથી નીકળેલો ગેસ બહાર જાય. ટર્બાઇન પોતે પણ અવાજ ઘટાડે છે.', 'टर्बाइन से निकली गैस बाहर जाती है। टर्बाइन खुद भी आवाज़ घटाता है।', 'Gas leaving the turbine goes out. The turbine itself also reduces exhaust noise.']],
  sump: [['ઓઇલ સમ્પ + પંપ + ફિલ્ટર', 'ऑयल संप + पंप + फिल्टर', 'Oil sump + pump + filter'], ['પંપ સમ્પમાંથી ઓઇલ ખેંચે → ફિલ્ટર → એન્જિનની ગેલેરી → <b>ફીડ પાઇપ</b>થી ટર્બો. ટર્બોમાંથી ઓઇલ <b>ગ્રેવિટીથી</b> જાડી ડ્રેઇન પાઇપમાં થઈ સમ્પમાં પાછું.', 'पंप संप से ऑयल खींचता है → फिल्टर → इंजन की गैलरी → <b>फीड पाइप</b> से टर्बो। टर्बो से ऑयल <b>ग्रेविटी से</b> मोटी ड्रेन पाइप से संप में वापस।', 'Pump draws oil from the sump → filter → engine gallery → <b>feed pipe</b> to the turbo. From the turbo, oil returns <b>by gravity</b> through the larger drain pipe.']],
  rad: [['રેડિયેટર + વોટર પંપ', 'रेडिएटर + वॉटर पंप', 'Radiator + water pump'], ['વોટર પંપ કૂલન્ટને એન્જિન અને ટર્બોના વોટર જેકેટમાં ફેરવે; રેડિયેટર તેની ગરમી હવામાં કાઢે.', 'वॉटर पंप कूलेंट को इंजन और टर्बो के वॉटर जैकेट में घुमाता है; रेडिएटर उसकी गर्मी हवा में निकालता है।', 'The water pump circulates coolant through the engine and the turbo water jacket; the radiator rejects the heat to air.']]
};
TL.SYS_NOTES = [
  '<div class="note"><b>🛢️ લ્યુબ્રિકેશન – 5 વાત યાદ રાખો</b><ol><li>ઓઇલ <b>ઉપરથી પ્રેશરથી</b> આવે, <b>નીચેથી ગ્રેવિટીથી</b> જાય.</li><li>ડ્રેઇન પાઇપ ફીડ કરતાં <b>જાડી</b> – ઓઇલ ફીણવાળું હોય.</li><li>સ્ટાર્ટ પછી 3–4 સેકન્ડમાં ઓઇલ ટર્બો સુધી પહોંચવું જોઈએ.</li><li>નવો ટર્બો: ઇનલેટમાં ઓઇલ ભરી, હાથથી ફેરવી, પછી જ ફિટ કરો (<span class="kw">પ્રી-લ્યુબ</span>).</li><li>ઓઇલ + ફિલ્ટર સમયસર બદલો – ટર્બોની આવરદા ઓઇલ પર છે.</li></ol></div><div class="note blue"><b>💧 કૂલિંગ – 3 રીત</b><ol><li><b>ઓઇલ કૂલિંગ:</b> ઓઇલ પોતે બેરિંગની ગરમી લઈ જાય.</li><li><b>વોટર કૂલિંગ:</b> કૂલન્ટ વોટર જેકેટમાં ફરે. એન્જિન બંધ થયા પછી પણ ગરમ પાણી આપમેળે ઉપર ચઢે (<span class="kw">થર્મો-સાઇફન</span>) અને ઠંડક આપે.</li><li><b>ઇન્ટરકૂલર:</b> ટર્બોને નહીં, <b>હવાને</b> ઠંડી કરે.</li></ol></div><div class="note red"><b>🔥 હીટ સોક:</b> એન્જિન બંધ થાય એટલે ઓઇલ ફરતું બંધ, પણ લાલચોળ ટર્બાઇનની ગરમી બેરિંગ તરફ આવે. એટલે બંધ કરતાં પહેલાં <b>1–2 મિનિટ આઇડલ</b>.</div>',
  '<div class="note"><b>🛢️ लुब्रिकेशन – 5 बातें याद रखो</b><ol><li>ऑयल <b>ऊपर से प्रेशर से</b> आता है, <b>नीचे से ग्रेविटी से</b> जाता है।</li><li>ड्रेन पाइप फीड से <b>मोटी</b> – ऑयल झागदार होता है।</li><li>स्टार्ट के बाद 3–4 सेकंड में ऑयल टर्बो तक पहुँचना चाहिए।</li><li>नया टर्बो: इनलेट में ऑयल भरकर, हाथ से घुमाकर, फिर ही फिट करो (<span class="kw">प्री-ल्यूब</span>)।</li><li>ऑयल + फिल्टर समय पर बदलो – टर्बो की उम्र ऑयल पर टिकी है।</li></ol></div><div class="note blue"><b>💧 कूलिंग – 3 तरीके</b><ol><li><b>ऑयल कूलिंग:</b> ऑयल खुद बेयरिंग की गर्मी ले जाता है।</li><li><b>वॉटर कूलिंग:</b> कूलेंट वॉटर जैकेट में घूमता है। इंजन बंद होने के बाद भी गरम पानी अपने आप ऊपर चढ़ता है (<span class="kw">थर्मो-साइफन</span>) और ठंडक देता है।</li><li><b>इंटरकूलर:</b> टर्बो को नहीं, <b>हवा को</b> ठंडा करता है।</li></ol></div><div class="note red"><b>🔥 हीट सोक:</b> इंजन बंद होते ही ऑयल घूमना बंद, पर लाल-गरम टर्बाइन की गर्मी बेयरिंग की ओर आती है। इसलिए बंद करने से पहले <b>1–2 मिनट आइडल</b>।</div>',
  '<div class="note"><b>🛢️ Lubrication – 5 things to remember</b><ol><li>Oil comes in <b>at the top under pressure</b> and leaves <b>at the bottom by gravity</b>.</li><li>The drain pipe is <b>bigger</b> than the feed – the oil is foamy.</li><li>Oil must reach the turbo within 3–4 seconds of starting.</li><li>New turbo: fill the inlet with oil, spin by hand, then fit (<span class="kw">pre-lube</span>).</li><li>Change oil + filter on time – turbo life depends on oil.</li></ol></div><div class="note blue"><b>💧 Cooling – 3 ways</b><ol><li><b>Oil cooling:</b> the oil itself carries bearing heat away.</li><li><b>Water cooling:</b> coolant circulates in the water jacket. Even after shut-down hot water rises by itself (<span class="kw">thermosiphon</span>) and keeps cooling.</li><li><b>Intercooler:</b> cools the <b>air</b>, not the turbo.</li></ol></div><div class="note red"><b>🔥 Heat soak:</b> when the engine stops, oil flow stops but heat from the red-hot turbine moves towards the bearings. So <b>idle 1–2 minutes</b> before switching off.</div>'
];

TL.THEORY = [
  { h: ['1. ટર્બોચાર્જર એટલે શું? કેમ જોઈએ?', '1. टर्बोचार्जर क्या है? क्यों चाहिए?', '1. What is a turbocharger? Why do we need it?'], b: [
    `<p>એન્જિનને પાવર બનાવવા <b>હવા + ડીઝલ</b> જોઈએ. સાદા એન્જિનમાં હવા પિસ્ટનના ખેંચાણથી જાતે અંદર આવે – આને <span class="kw">નેચરલી એસ્પિરેટેડ (NA)</span> એન્જિન કહેવાય. તેમાં સિલિન્ડર પૂરો ભરાતો નથી.</p><p><b>ટર્બોચાર્જર = એક્ઝોસ્ટ ગેસથી ચાલતો હવાનો પંપ.</b> તે હવાને દબાવીને સિલિન્ડરમાં ઠાંસે છે. આને <span class="kw">ફોર્સ્ડ ઇન્ડક્શન</span> કહેવાય.</p><ul><li>ડીઝલની લગભગ <b>30–35% ઊર્જા</b> એક્ઝોસ્ટ ગેસમાં નકામી જાય છે. ટર્બો એમાંથી થોડી પાછી વાપરે છે.</li><li>વધુ હવા → વધુ ડીઝલ પૂરું બળે → એ જ એન્જિનમાંથી <b>30–40% વધુ પાવર</b>.</li></ul><div class="note">સહેલું ઉદાહરણ: ફૂંક મારવાથી ચૂલો વધારે સળગે – ટર્બો એન્જિનને "ફૂંક" મારે છે.</div>`,
    `<p>इंजन को पावर बनाने के लिए <b>हवा + डीज़ल</b> चाहिए। सादे इंजन में हवा पिस्टन के खिंचाव से अपने आप अंदर आती है – इसे <span class="kw">नैचुरली एस्पिरेटेड (NA)</span> इंजन कहते हैं। उसमें सिलेंडर पूरा नहीं भरता।</p><p><b>टर्बोचार्जर = एग्जॉस्ट गैस से चलने वाला हवा का पंप।</b> वह हवा को दबाकर सिलेंडर में ठूँसता है। इसे <span class="kw">फोर्स्ड इंडक्शन</span> कहते हैं।</p><ul><li>डीज़ल की लगभग <b>30–35% ऊर्जा</b> एग्जॉस्ट गैस में बेकार जाती है। टर्बो उसमें से कुछ वापस इस्तेमाल करता है।</li><li>ज़्यादा हवा → ज़्यादा डीज़ल पूरा जलता है → उसी इंजन से <b>30–40% ज़्यादा पावर</b>।</li></ul><div class="note">आसान उदाहरण: फूँक मारने से चूल्हा ज़्यादा जलता है – टर्बो इंजन को "फूँक" मारता है।</div>`,
    `<p>An engine needs <b>air + diesel</b> to make power. In a plain engine the piston’s suction pulls air in – a <span class="kw">naturally aspirated (NA)</span> engine. Its cylinder never fills completely.</p><p><b>Turbocharger = an air pump driven by exhaust gas.</b> It compresses air and packs it into the cylinder. This is <span class="kw">forced induction</span>.</p><ul><li>About <b>30–35% of the fuel energy</b> is wasted in the exhaust gas. The turbo recovers part of it.</li><li>More air → more diesel burns completely → <b>30–40% more power</b> from the same engine.</li></ul><div class="note">Simple example: blowing on a fire makes it burn harder – the turbo “blows” on the engine.</div>`] },
  { h: ['2. કેવી રીતે કામ કરે? (6 સ્ટેપ)', '2. कैसे काम करता है? (6 स्टेप)', '2. How does it work? (6 steps)'], b: [
    `<ol><li>એક્ઝોસ્ટ ગેસ એક્ઝોસ્ટ મેનિફોલ્ડમાંથી <b>ટર્બાઇન હાઉસિંગ</b>માં આવે.</li><li>ગેસ <b>ટર્બાઇન વ્હીલ</b> ફેરવે (1–2.5 લાખ RPM).</li><li>એ જ શાફ્ટ પરનું <b>કમ્પ્રેસર વ્હીલ</b> ફરે.</li><li>કમ્પ્રેસર એર ફિલ્ટરમાંથી હવા ખેંચી <b>દબાવે</b> (બૂસ્ટ).</li><li><b>ઇન્ટરકૂલર</b> ગરમ હવાને ઠંડી અને ઘટ્ટ કરે.</li><li>ઘટ્ટ હવા ઇન્ટેક મેનિફોલ્ડથી સિલિન્ડરમાં → વધુ પાવર.</li></ol><div class="note blue"><b>યાદ રાખો:</b> ટર્બાઇન = ચલાવનાર (ગરમ 🔴). કમ્પ્રેસર = ચાલનાર (ઠંડું 🔵). બંને વચ્ચે માત્ર શાફ્ટનું જોડાણ છે – ગેસ અને હવા ક્યારેય ભેગા થતા નથી.</div>`,
    `<ol><li>एग्जॉस्ट गैस एग्जॉस्ट मैनिफोल्ड से <b>टर्बाइन हाउसिंग</b> में आती है।</li><li>गैस <b>टर्बाइन व्हील</b> घुमाती है (1–2.5 लाख RPM)।</li><li>उसी शाफ्ट पर लगा <b>कंप्रेसर व्हील</b> घूमता है।</li><li>कंप्रेसर एयर फिल्टर से हवा खींचकर <b>दबाता</b> है (बूस्ट)।</li><li><b>इंटरकूलर</b> गरम हवा को ठंडा और घना करता है।</li><li>घनी हवा इनटेक मैनिफोल्ड से सिलेंडर में → ज़्यादा पावर।</li></ol><div class="note blue"><b>याद रखो:</b> टर्बाइन = चलाने वाला (गरम 🔴)। कंप्रेसर = चलने वाला (ठंडा 🔵)। दोनों के बीच सिर्फ़ शाफ्ट का जोड़ है – गैस और हवा कभी नहीं मिलतीं।</div>`,
    `<ol><li>Exhaust gas flows from the exhaust manifold into the <b>turbine housing</b>.</li><li>The gas spins the <b>turbine wheel</b> (100,000–250,000 RPM).</li><li>The <b>compressor wheel</b> on the same shaft spins.</li><li>The compressor draws air through the air filter and <b>compresses</b> it (boost).</li><li>The <b>intercooler</b> cools the hot air and makes it dense.</li><li>Dense air goes through the intake manifold into the cylinder → more power.</li></ol><div class="note blue"><b>Remember:</b> turbine = driver (hot 🔴). Compressor = driven (cold 🔵). Only the shaft links them – gas and air never mix.</div>`] },
  { h: ['3. મુખ્ય ભાગો (આકૃતિ સાથે)', '3. मुख्य भाग (चित्र के साथ)', '3. Main parts (with figure)'], fig: true, b: [
    `<p>ટર્બોના <b>ત્રણ મુખ્ય ભાગ</b>: ① કમ્પ્રેસર બાજુ (ઠંડી), ② સેન્ટર/બેરિંગ હાઉસિંગ – <span class="kw">CHRA</span> (Center Housing Rotating Assembly), ③ ટર્બાઇન બાજુ (ગરમ). વિગતવાર કામ અને મટીરિયલ માટે "પાર્ટ્સ અને મટીરિયલ" ટેબ જુઓ.</p>`,
    `<p>टर्बो के <b>तीन मुख्य भाग</b>: ① कंप्रेसर साइड (ठंडी), ② सेंटर/बेयरिंग हाउसिंग – <span class="kw">CHRA</span> (Center Housing Rotating Assembly), ③ टर्बाइन साइड (गरम)। विस्तार से काम और मटीरियल के लिए "पार्ट्स और मटीरियल" टैब देखो।</p>`,
    `<p>A turbo has <b>three main sections</b>: ① compressor side (cold), ② centre/bearing housing – <span class="kw">CHRA</span> (Center Housing Rotating Assembly), ③ turbine side (hot). See the “Parts & materials” tab for each part’s job and material.</p>`] },
  { h: ['4. કમ્પ્રેસર અને ટર્બાઇન', '4. कंप्रेसर और टर्बाइन', '4. Compressor and turbine'], b: [
    `<ul><li><b>કમ્પ્રેસર = સેન્ટ્રીફ્યુગલ પ્રકાર.</b> હવા વચ્ચેથી (<span class="kw">ઇન્ડ્યુસર</span>) અંદર આવે, ફરતી બ્લેડ તેને બહારની ધાર (<span class="kw">એક્સડ્યુસર</span>) તરફ ફેંકે. પછી <span class="kw">ડિફ્યુઝર</span> અને વોલ્યુટમાં હવાની <b>ઝડપ ઘટે અને દબાણ વધે</b>.</li><li><b>ટર્બાઇન = રેડિયલ ઇનફ્લો પ્રકાર.</b> ગેસ બહારની ધારથી અંદર આવે અને વચ્ચેથી બહાર નીકળે – કમ્પ્રેસરથી ઊંધું.</li><li><span class="kw">A/R રેશિયો</span>: ટર્બાઇન હાઉસિંગના રસ્તાનું માપ. નાનો A/R = જલદી બૂસ્ટ (ઓછો લેગ) પણ ઊંચા RPM પર ગૂંગળામણ. મોટો A/R = ઊંચા RPM પર વધુ પાવર, પણ લેગ વધારે.</li></ul>`,
    `<ul><li><b>कंप्रेसर = सेंट्रीफ्यूगल प्रकार।</b> हवा बीच से (<span class="kw">इंड्यूसर</span>) अंदर आती है, घूमती ब्लेड उसे बाहरी किनारे (<span class="kw">एक्सड्यूसर</span>) की ओर फेंकती है। फिर <span class="kw">डिफ्यूज़र</span> और वॉल्यूट में हवा की <b>रफ़्तार घटती और दबाव बढ़ता है</b>।</li><li><b>टर्बाइन = रेडियल इनफ्लो प्रकार।</b> गैस बाहरी किनारे से अंदर आती है और बीच से बाहर निकलती है – कंप्रेसर का उल्टा।</li><li><span class="kw">A/R रेशियो</span>: टर्बाइन हाउसिंग के रास्ते का माप। छोटा A/R = जल्दी बूस्ट (कम लैग) पर ऊँचे RPM पर घुटन। बड़ा A/R = ऊँचे RPM पर ज़्यादा पावर, पर लैग ज़्यादा।</li></ul>`,
    `<ul><li><b>Compressor = centrifugal type.</b> Air enters at the centre (<span class="kw">inducer</span>), the spinning blades throw it to the outer edge (<span class="kw">exducer</span>). In the <span class="kw">diffuser</span> and volute the air <b>slows down and its pressure rises</b>.</li><li><b>Turbine = radial-inflow type.</b> Gas enters at the outer edge and leaves at the centre – the opposite of the compressor.</li><li><span class="kw">A/R ratio</span>: the size of the turbine housing passage. Small A/R = early boost (less lag) but chokes at high RPM. Large A/R = more top-end power but more lag.</li></ul>`] },
  { h: ['5. બેરિંગ સિસ્ટમ', '5. बेयरिंग सिस्टम', '5. Bearing system'], b: [
    `<ul><li><b>ફુલ-ફ્લોટિંગ જર્નલ બેરિંગ:</b> બ્રોન્ઝનું બુશ શાફ્ટ અને હાઉસિંગ વચ્ચે <b>ઓઇલમાં તરે</b> છે. શાફ્ટ લાખ RPM પર ફરે, બુશ લગભગ અડધી ઝડપે. બે ઓઇલ ફિલ્મ = ઓછો ઘસારો + ધ્રુજારી શોષાય.</li><li><b>થ્રસ્ટ બેરિંગ:</b> ગેસ અને હવાના ધક્કાથી શાફ્ટ આગળ-પાછળ ખસવા જાય – તેને રોકે.</li><li><b>બોલ બેરિંગ ટર્બો:</b> નવી ટેકનોલોજી. ઘર્ષણ ઓછું → ઝડપથી સ્પીડ પકડે (લેગ ઓછો), ઓઇલ ઓછું જોઈએ, પણ મોંઘું.</li></ul><div class="note red">ધાતુ ધાતુને અડતી નથી – વચ્ચે માત્ર ઓઇલ છે. ઓઇલ ગયું = બેરિંગ ગયું.</div>`,
    `<ul><li><b>फुल-फ्लोटिंग जर्नल बेयरिंग:</b> ब्रॉन्ज़ का बुश शाफ्ट और हाउसिंग के बीच <b>ऑयल में तैरता</b> है। शाफ्ट लाख RPM पर घूमता है, बुश लगभग आधी रफ़्तार से। दो ऑयल फिल्म = कम घिसाव + कंपन सोखा जाता है।</li><li><b>थ्रस्ट बेयरिंग:</b> गैस और हवा के धक्के से शाफ्ट आगे-पीछे खिसकना चाहता है – उसे रोकता है।</li><li><b>बॉल बेयरिंग टर्बो:</b> नई टेक्नोलॉजी। घर्षण कम → जल्दी स्पीड पकड़ता है (लैग कम), ऑयल कम चाहिए, पर महँगा।</li></ul><div class="note red">धातु धातु को नहीं छूती – बीच में सिर्फ़ ऑयल है। ऑयल गया = बेयरिंग गया।</div>`,
    `<ul><li><b>Full-floating journal bearing:</b> a bronze bush <b>floats in oil</b> between shaft and housing. The shaft turns at 100,000+ RPM, the bush at about half that. Two oil films = little wear + vibration damping.</li><li><b>Thrust bearing:</b> gas and air forces try to push the shaft in and out – it stops that.</li><li><b>Ball-bearing turbo:</b> newer technology. Less friction → spools faster (less lag), needs less oil, but costs more.</li></ul><div class="note red">Metal never touches metal – only oil is in between. No oil = no bearing.</div>`] },
  { h: ['6. બૂસ્ટ કંટ્રોલ: વેસ્ટગેટ અને VGT', '6. बूस्ट कंट्रोल: वेस्टगेट और VGT', '6. Boost control: wastegate and VGT'], svg: 'vgt', b: [
    `<p>ટર્બોને કાબૂમાં ન રાખીએ તો બૂસ્ટ વધતું જ જાય – એન્જિન અને ટર્બો બંને તૂટે.</p><ul><li><b>વેસ્ટગેટ:</b> ટર્બાઇન હાઉસિંગમાં નાનો વાલ્વ. બૂસ્ટ સેટ લિમિટે પહોંચે → એક્ચ્યુએટરનું ડાયાફ્રામ દબાય → રોડ વાલ્વ ખોલે → થોડો ગેસ ટર્બાઇનને <b>બાયપાસ</b> કરે.</li><li><b>VGT / VNT (Variable Geometry Turbo):</b> ટર્બાઇન વ્હીલની આસપાસ ફરી શકે તેવી નાની <span class="kw">વેન</span>. ઓછા RPM પર વેન <b>સાંકડી</b> → ગેસની ઝડપ વધે → જલદી બૂસ્ટ. ઊંચા RPM પર વેન <b>ખુલ્લી</b> → વધુ ગેસ પસાર થાય. આજના મોટા ભાગના ડીઝલમાં VGT છે, ECU તેને કંટ્રોલ કરે.</li></ul><div class="note"><span class="kw">ટર્બો લેગ</span> = એક્સિલરેટર દબાવ્યા પછી બૂસ્ટ આવવામાં લાગતો સમય. કારણ: વ્હીલને ઝડપ પકડતાં વાર લાગે. ઉપાય: નાનો ટર્બો, VGT, ટ્વિન-સ્ક્રોલ, બોલ બેરિંગ, ઇલેક્ટ્રિક ટર્બો.</div>`,
    `<p>टर्बो को काबू में न रखें तो बूस्ट बढ़ता ही जाए – इंजन और टर्बो दोनों टूटें।</p><ul><li><b>वेस्टगेट:</b> टर्बाइन हाउसिंग में छोटा वाल्व। बूस्ट सेट लिमिट पर पहुँचे → एक्चुएटर का डायाफ्राम दबता है → रॉड वाल्व खोलती है → थोड़ी गैस टर्बाइन को <b>बायपास</b> करती है।</li><li><b>VGT / VNT (Variable Geometry Turbo):</b> टर्बाइन व्हील के चारों ओर घूम सकने वाली छोटी <span class="kw">वेन</span>। कम RPM पर वेन <b>सँकरी</b> → गैस की रफ़्तार बढ़ती है → जल्दी बूस्ट। ऊँचे RPM पर वेन <b>खुली</b> → ज़्यादा गैस निकलती है। आज के ज़्यादातर डीज़ल में VGT है, ECU उसे कंट्रोल करता है।</li></ul><div class="note"><span class="kw">टर्बो लैग</span> = एक्सीलरेटर दबाने के बाद बूस्ट आने में लगने वाला समय। कारण: व्हील को रफ़्तार पकड़ने में देर लगती है। उपाय: छोटा टर्बो, VGT, ट्विन-स्क्रॉल, बॉल बेयरिंग, इलेक्ट्रिक टर्बो।</div>`,
    `<p>Without control, boost would keep rising – breaking both engine and turbo.</p><ul><li><b>Wastegate:</b> a small valve in the turbine housing. Boost reaches the set limit → the actuator diaphragm moves → the rod opens the valve → some gas <b>bypasses</b> the turbine.</li><li><b>VGT / VNT (Variable Geometry Turbo):</b> small movable <span class="kw">vanes</span> around the turbine wheel. At low RPM the vanes <b>close up</b> → gas speeds up → early boost. At high RPM they <b>open</b> → more gas passes. Most modern diesels use a VGT controlled by the ECU.</li></ul><div class="note"><span class="kw">Turbo lag</span> = the delay between pressing the accelerator and getting boost. Cause: the wheels need time to spin up. Cures: smaller turbo, VGT, twin-scroll, ball bearings, electric turbo.</div>`] },
  { h: ['7. ટર્બોના પ્રકાર', '7. टर्बो के प्रकार', '7. Types of turbo'], b: [
    `<div class="tw"><table><tr><th>પ્રકાર</th><th>સમજ</th></tr><tr><td><b>સિંગલ ટર્બો (ફિક્સ્ડ)</b></td><td>એક ટર્બો + વેસ્ટગેટ. સાદો, સસ્તો.</td></tr><tr><td><b>VGT / VNT</b></td><td>ફરતી વેન – ઓછા અને ઊંચા બંને RPM પર સારું બૂસ્ટ.</td></tr><tr><td><b>ટ્વિન-સ્ક્રોલ</b></td><td>ટર્બાઇન હાઉસિંગમાં બે રસ્તા – સિલિન્ડરના ગેસના ધક્કા એકબીજાને નડે નહીં.</td></tr><tr><td><b>ટ્વિન ટર્બો</b></td><td>બે ટર્બો – સાથે (પેરેલલ) અથવા નાનો-પછી-મોટો (સિક્વેન્શિયલ).</td></tr><tr><td><b>ટુ-સ્ટેજ</b></td><td>હવા બે વાર દબાય – ખૂબ ઊંચું બૂસ્ટ (હેવી ડીઝલ).</td></tr><tr><td><b>ઇલેક્ટ્રિક (e-turbo)</b></td><td>મોટર શાફ્ટને તરત ફેરવે – લેગ લગભગ શૂન્ય.</td></tr></table></div>`,
    `<div class="tw"><table><tr><th>प्रकार</th><th>समझ</th></tr><tr><td><b>सिंगल टर्बो (फिक्स्ड)</b></td><td>एक टर्बो + वेस्टगेट। सादा, सस्ता।</td></tr><tr><td><b>VGT / VNT</b></td><td>घूमने वाली वेन – कम और ऊँचे दोनों RPM पर अच्छा बूस्ट।</td></tr><tr><td><b>ट्विन-स्क्रॉल</b></td><td>टर्बाइन हाउसिंग में दो रास्ते – सिलेंडरों की गैस के धक्के एक-दूसरे को नहीं रोकते।</td></tr><tr><td><b>ट्विन टर्बो</b></td><td>दो टर्बो – साथ-साथ (पैरेलल) या छोटा-फिर-बड़ा (सीक्वेंशियल)।</td></tr><tr><td><b>टू-स्टेज</b></td><td>हवा दो बार दबती है – बहुत ऊँचा बूस्ट (हैवी डीज़ल)।</td></tr><tr><td><b>इलेक्ट्रिक (e-turbo)</b></td><td>मोटर शाफ्ट को तुरंत घुमाती है – लैग लगभग शून्य।</td></tr></table></div>`,
    `<div class="tw"><table><tr><th>Type</th><th>Idea</th></tr><tr><td><b>Single turbo (fixed)</b></td><td>One turbo + wastegate. Simple, cheap.</td></tr><tr><td><b>VGT / VNT</b></td><td>Moving vanes – good boost at both low and high RPM.</td></tr><tr><td><b>Twin-scroll</b></td><td>Two passages in the turbine housing – exhaust pulses from the cylinders do not disturb each other.</td></tr><tr><td><b>Twin turbo</b></td><td>Two turbos – parallel, or small-then-large (sequential).</td></tr><tr><td><b>Two-stage</b></td><td>Air is compressed twice – very high boost (heavy diesels).</td></tr><tr><td><b>Electric (e-turbo)</b></td><td>A motor spins the shaft instantly – almost zero lag.</td></tr></table></div>`] },
  { h: ['8. ફાયદા ✅', '8. फायदे ✅', '8. Advantages ✅'], b: [
    `<ol><li><b>વધુ પાવર અને ટોર્ક</b> – એ જ સાઇઝના એન્જિનમાંથી 30–40% વધારે.</li><li><b>નાનું એન્જિન, મોટું કામ</b> (ડાઉનસાઇઝિંગ) – વજન અને જગ્યા બચે.</li><li><b>સારું માઇલેજ</b> – ડીઝલ પૂરું બળે, નકામી ગરમી વપરાય.</li><li><b>ઓછો ધુમાડો</b> – વધુ હવા = પૂરું દહન = ઓછો કાળો ધુમાડો (PM, CO, HC).</li><li><b>ઊંચાઈ પર પણ પાવર</b> – પહાડમાં હવા પાતળી હોય, ટર્બો તે ખોટ પૂરી કરે.</li><li><b>એક્ઝોસ્ટનો અવાજ ઓછો</b> – ટર્બાઇન સાયલેન્સર જેવું કામ કરે.</li><li><b>મફતની ઊર્જા</b> – સુપરચાર્જરની જેમ એન્જિનનો પાવર ખાતું નથી.</li></ol>`,
    `<ol><li><b>ज़्यादा पावर और टॉर्क</b> – उसी साइज़ के इंजन से 30–40% ज़्यादा।</li><li><b>छोटा इंजन, बड़ा काम</b> (डाउनसाइज़िंग) – वज़न और जगह बचती है।</li><li><b>अच्छा माइलेज</b> – डीज़ल पूरा जलता है, बेकार गर्मी काम आती है।</li><li><b>कम धुआँ</b> – ज़्यादा हवा = पूरा दहन = कम काला धुआँ (PM, CO, HC)।</li><li><b>ऊँचाई पर भी पावर</b> – पहाड़ में हवा पतली होती है, टर्बो वह कमी पूरी करता है।</li><li><b>एग्जॉस्ट की आवाज़ कम</b> – टर्बाइन साइलेंसर जैसा काम करता है।</li><li><b>मुफ़्त की ऊर्जा</b> – सुपरचार्जर की तरह इंजन की पावर नहीं खाता।</li></ol>`,
    `<ol><li><b>More power and torque</b> – 30–40% more from the same size engine.</li><li><b>Small engine, big job</b> (downsizing) – saves weight and space.</li><li><b>Better mileage</b> – diesel burns completely, waste heat is reused.</li><li><b>Less smoke</b> – more air = complete combustion = less black smoke (PM, CO, HC).</li><li><b>Power at altitude</b> – mountain air is thin; the turbo makes up the loss.</li><li><b>Quieter exhaust</b> – the turbine acts like a silencer.</li><li><b>Free energy</b> – unlike a supercharger it takes no power from the crankshaft.</li></ol>`] },
  { h: ['9. ગેરફાયદા / મર્યાદા ⚠️', '9. नुकसान / सीमाएँ ⚠️', '9. Disadvantages / limits ⚠️'], b: [
    `<ol><li><b>ટર્બો લેગ</b> – ઓછા RPM પર પ્રતિભાવ મોડો.</li><li><b>ખૂબ ગરમી અને ઝડપ</b> – મોંઘા મટીરિયલ જોઈએ.</li><li><b>ઓઇલ પર પૂરો આધાર</b> – ઓઇલમાં બેદરકારી = ટર્બો ફેલ.</li><li><b>મોંઘું અને જટિલ</b> – ઇન્ટરકૂલર, પાઇપ, સેન્સર વધે; રિપેર મોંઘું.</li><li><b>એન્જિન પર વધુ ભાર</b> – સિલિન્ડરનું દબાણ અને ગરમી વધે.</li><li><b>ડ્રાઇવરે કાળજી રાખવી પડે</b> – ઠંડા એન્જિનને રેસ ન કરાય, ગરમ એન્જિન તરત બંધ ન કરાય.</li></ol>`,
    `<ol><li><b>टर्बो लैग</b> – कम RPM पर जवाब देर से।</li><li><b>बहुत गर्मी और रफ़्तार</b> – महँगे मटीरियल चाहिए।</li><li><b>ऑयल पर पूरा निर्भर</b> – ऑयल में लापरवाही = टर्बो फेल।</li><li><b>महँगा और जटिल</b> – इंटरकूलर, पाइप, सेंसर बढ़ते हैं; रिपेयर महँगा।</li><li><b>इंजन पर ज़्यादा भार</b> – सिलेंडर का दबाव और गर्मी बढ़ती है।</li><li><b>ड्राइवर को ध्यान रखना पड़ता है</b> – ठंडे इंजन को रेस नहीं करना, गरम इंजन तुरंत बंद नहीं करना।</li></ol>`,
    `<ol><li><b>Turbo lag</b> – slow response at low RPM.</li><li><b>Extreme heat and speed</b> – needs expensive materials.</li><li><b>Totally dependent on oil</b> – careless oil care = turbo failure.</li><li><b>Costly and complex</b> – extra intercooler, pipes, sensors; expensive repairs.</li><li><b>More load on the engine</b> – higher cylinder pressure and heat.</li><li><b>Driver must take care</b> – no revving a cold engine, no instant shut-down when hot.</li></ol>`] },
  { h: ['10. ટર્બોચાર્જર vs સુપરચાર્જર', '10. टर्बोचार्जर vs सुपरचार्जर', '10. Turbocharger vs supercharger'], b: [
    `<div class="tw"><table><tr><th>મુદ્દો</th><th>ટર્બોચાર્જર</th><th>સુપરચાર્જર</th></tr><tr><td>કોણ ચલાવે?</td><td>એક્ઝોસ્ટ ગેસ (મફત)</td><td>એન્જિનનો બેલ્ટ/ગિયર (પાવર ખાય)</td></tr><tr><td>લેગ</td><td>હોય છે</td><td>નથી – તરત બૂસ્ટ</td></tr><tr><td>માઇલેજ</td><td>સારું</td><td>ઓછું</td></tr><tr><td>ઝડપ</td><td>1–2.5 લાખ RPM</td><td>≈ 50,000 RPM સુધી</td></tr><tr><td>ગરમી</td><td>ખૂબ વધારે</td><td>ઓછી</td></tr><tr><td>વપરાશ</td><td>લગભગ બધાં ડીઝલ</td><td>થોડી પેટ્રોલ/રેસિંગ કાર</td></tr></table></div>`,
    `<div class="tw"><table><tr><th>मुद्दा</th><th>टर्बोचार्जर</th><th>सुपरचार्जर</th></tr><tr><td>कौन चलाता है?</td><td>एग्जॉस्ट गैस (मुफ़्त)</td><td>इंजन का बेल्ट/गियर (पावर खाता है)</td></tr><tr><td>लैग</td><td>होता है</td><td>नहीं – तुरंत बूस्ट</td></tr><tr><td>माइलेज</td><td>अच्छा</td><td>कम</td></tr><tr><td>रफ़्तार</td><td>1–2.5 लाख RPM</td><td>≈ 50,000 RPM तक</td></tr><tr><td>गर्मी</td><td>बहुत ज़्यादा</td><td>कम</td></tr><tr><td>उपयोग</td><td>लगभग सभी डीज़ल</td><td>कुछ पेट्रोल/रेसिंग कार</td></tr></table></div>`,
    `<div class="tw"><table><tr><th>Point</th><th>Turbocharger</th><th>Supercharger</th></tr><tr><td>Driven by</td><td>Exhaust gas (free)</td><td>Engine belt/gear (uses power)</td></tr><tr><td>Lag</td><td>Yes</td><td>No – instant boost</td></tr><tr><td>Mileage</td><td>Better</td><td>Worse</td></tr><tr><td>Speed</td><td>100,000–250,000 RPM</td><td>up to ≈ 50,000 RPM</td></tr><tr><td>Heat</td><td>Very high</td><td>Low</td></tr><tr><td>Used on</td><td>Almost all diesels</td><td>Some petrol/racing cars</td></tr></table></div>`] },
  { h: ['11. ટર્બોની કાળજી – કરો / ન કરો', '11. टर्बो की देखभाल – करो / मत करो', '11. Turbo care – do / don’t'], b: [
    `<div class="note green"><b>✅ કરો</b><ul><li>સ્ટાર્ટ પછી 30 સેકન્ડ આઇડલ – ઓઇલને ટર્બો સુધી પહોંચવા દો.</li><li>બંધ કરતાં પહેલાં 1–2 મિનિટ આઇડલ.</li><li>સાચા ગ્રેડનું ઓઇલ અને અસલી ફિલ્ટર, સમયસર બદલો.</li><li>એર ફિલ્ટર સ્વચ્છ રાખો; હોઝના ક્લેમ્પ ટાઇટ.</li><li>નવો ટર્બો નાખો ત્યારે: જૂનો કેમ ફેલ થયો તે શોધો, ઓઇલ + ફિલ્ટર + ફીડ પાઇપ બદલો, પ્રી-લ્યુબ કરો.</li></ul></div><div class="note red"><b>❌ ન કરો</b><ul><li>ઠંડા એન્જિનને રેસ ન કરો.</li><li>બંધ કરતી વખતે રેસ આપીને ચાવી બંધ ન કરો.</li><li>ગાસ્કેટ પર સિલિકોન ન લગાવો – ટુકડા ઓઇલનો રસ્તો બંધ કરે.</li><li>વેસ્ટગેટ રોડની લંબાઈ જાતે ન બદલો.</li><li>ટર્બોને એક્ચ્યુએટર રોડથી ન ઊંચકો.</li></ul></div>`,
    `<div class="note green"><b>✅ करो</b><ul><li>स्टार्ट के बाद 30 सेकंड आइडल – ऑयल को टर्बो तक पहुँचने दो।</li><li>बंद करने से पहले 1–2 मिनट आइडल।</li><li>सही ग्रेड का ऑयल और असली फिल्टर, समय पर बदलो।</li><li>एयर फिल्टर साफ़ रखो; होज़ के क्लैंप टाइट।</li><li>नया टर्बो लगाते समय: पुराना क्यों फेल हुआ यह ढूँढो, ऑयल + फिल्टर + फीड पाइप बदलो, प्री-ल्यूब करो।</li></ul></div><div class="note red"><b>❌ मत करो</b><ul><li>ठंडे इंजन को रेस मत करो।</li><li>बंद करते समय रेस देकर चाबी बंद मत करो।</li><li>गैसकेट पर सिलिकॉन मत लगाओ – टुकड़े ऑयल का रास्ता बंद करते हैं।</li><li>वेस्टगेट रॉड की लंबाई खुद मत बदलो।</li><li>टर्बो को एक्चुएटर रॉड से मत उठाओ।</li></ul></div>`,
    `<div class="note green"><b>✅ Do</b><ul><li>Idle 30 seconds after starting – let oil reach the turbo.</li><li>Idle 1–2 minutes before switching off.</li><li>Correct grade oil and a genuine filter, changed on time.</li><li>Keep the air filter clean; hose clamps tight.</li><li>When fitting a new turbo: find why the old one failed, change oil + filter + feed pipe, pre-lube.</li></ul></div><div class="note red"><b>❌ Don’t</b><ul><li>Don’t rev a cold engine.</li><li>Don’t blip the throttle and switch off.</li><li>Don’t use silicone on gaskets – bits block the oil passage.</li><li>Don’t alter the wastegate rod length yourself.</li><li>Don’t lift the turbo by its actuator rod.</li></ul></div>`] },
  { h: ['12. ટર્બો કેમ ફેલ થાય? (ટૂંકમાં)', '12. टर्बो क्यों फेल होता है? (संक्षेप में)', '12. Why turbos fail (summary)'], b: [
    `<p>ટર્બો જાતે ભાગ્યે જ બગડે – લગભગ હંમેશા <b>બહારનું કારણ</b> હોય છે:</p><ol><li><b>ઓઇલની અછત</b> – સૌથી મોટું કારણ.</li><li><b>ગંદું ઓઇલ</b> – બેરિંગ ઘસાય.</li><li><b>બહારની વસ્તુ</b> – બ્લેડ તૂટે.</li><li><b>ઓવરસ્પીડ / વધુ ગરમી</b> – વ્હીલ ફાટે, હાઉસિંગમાં તિરાડ.</li><li><b>હોટ શટડાઉન</b> – ઓઇલનું કાર્બન.</li></ol><p>🔵 વાદળી ધુમાડો = ઓઇલ બળે છે · ⚫ કાળો ધુમાડો = હવા ઓછી · ⚪ સફેદ = કૂલન્ટ/કાચું ડીઝલ.</p><p>વિગત અને 3D અસર માટે <b>"ફેલ્યોર લેબ"</b> ટેબ જુઓ.</p>`,
    `<p>टर्बो खुद शायद ही खराब होता है – लगभग हमेशा <b>बाहर का कारण</b> होता है:</p><ol><li><b>ऑयल की कमी</b> – सबसे बड़ा कारण।</li><li><b>गंदा ऑयल</b> – बेयरिंग घिसते हैं।</li><li><b>बाहरी चीज़</b> – ब्लेड टूटती है।</li><li><b>ओवरस्पीड / ज़्यादा गर्मी</b> – व्हील फटता है, हाउसिंग में दरार।</li><li><b>हॉट शटडाउन</b> – ऑयल का कार्बन।</li></ol><p>🔵 नीला धुआँ = ऑयल जल रहा है · ⚫ काला धुआँ = हवा कम · ⚪ सफ़ेद = कूलेंट/कच्चा डीज़ल।</p><p>विस्तार और 3D असर के लिए <b>"फेल्योर लैब"</b> टैब देखो।</p>`,
    `<p>A turbo rarely fails by itself – there is almost always an <b>outside cause</b>:</p><ol><li><b>Lack of oil</b> – the biggest cause.</li><li><b>Dirty oil</b> – bearings wear.</li><li><b>Foreign objects</b> – blades break.</li><li><b>Overspeed / overheating</b> – wheel bursts, housing cracks.</li><li><b>Hot shutdown</b> – oil turns to carbon.</li></ol><p>🔵 Blue smoke = oil burning · ⚫ black smoke = too little air · ⚪ white = coolant/unburnt diesel.</p><p>See the <b>“Failure lab”</b> tab for details and the 3D effect.</p>`] }
];

TL.figVGT = function (lang) {
  const t = [['ઓછા RPM: વેન સાંકડી', 'ઊંચા RPM: વેન ખુલ્લી', 'ગેસ ઝડપી → જલદી બૂસ્ટ', 'વધુ ગેસ પસાર થાય'], ['कम RPM: वेन सँकरी', 'ऊँचे RPM: वेन खुली', 'गैस तेज़ → जल्दी बूस्ट', 'ज़्यादा गैस निकलती है'], ['Low RPM: vanes closed up', 'High RPM: vanes open', 'Fast gas → early boost', 'More gas passes']][lang];
  const ring = (cx, ang) => { let s = `<circle cx="${cx}" cy="100" r="34" fill="#f5b9a8" stroke="#a12813" stroke-width="2"/><circle cx="${cx}" cy="100" r="8" fill="#566575"/>`; for (let i = 0; i < 6; i++) s += `<path d="M${cx} 100 q10 -14 0 -32" fill="none" stroke="#a12813" stroke-width="3" transform="rotate(${i * 60} ${cx} 100)"/>`; for (let i = 0; i < 9; i++) { const a = i * 40, r = 56, x = cx + r * Math.cos(a * Math.PI / 180), y = 100 + r * Math.sin(a * Math.PI / 180); s += `<rect x="${x - 13}" y="${y - 3}" width="26" height="6" rx="3" fill="#13202c" transform="rotate(${a + ang} ${x} ${y})"/>`; } return s + `<circle cx="${cx}" cy="100" r="76" fill="none" stroke="#e2452a" stroke-width="5" stroke-dasharray="6 6"/>`; };
  return `<svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif"><rect width="420" height="220" fill="#fff"/>${ring(105, 80)}${ring(315, 35)}<text x="105" y="196" text-anchor="middle" font-size="13" font-weight="700">${t[0]}</text><text x="315" y="196" text-anchor="middle" font-size="13" font-weight="700">${t[1]}</text><text x="105" y="213" text-anchor="middle" font-size="11.5" fill="#566575">${t[2]}</text><text x="315" y="213" text-anchor="middle" font-size="11.5" fill="#566575">${t[3]}</text></svg>`;
};

TL.MCQ = [
  { q: ['ટર્બોચાર્જર કઈ ઊર્જાથી ચાલે છે?', 'टर्बोचार्जर किस ऊर्जा से चलता है?', 'What drives a turbocharger?'], o: [['બેટરી', 'बैटरी', 'Battery'], ['એક્ઝોસ્ટ ગેસ', 'एग्जॉस्ट गैस', 'Exhaust gas'], ['ફેન બેલ્ટ', 'फैन बेल्ट', 'Fan belt'], ['ક્રેન્કશાફ્ટ ગિયર', 'क्रैंकशाफ्ट गियर', 'Crankshaft gear']], a: 1, e: ['ટર્બાઇન વ્હીલને એક્ઝોસ્ટ ગેસ ફેરવે છે. બેલ્ટથી ચાલે તે સુપરચાર્જર.', 'टर्बाइन व्हील को एग्जॉस्ट गैस घुमाती है। बेल्ट से चले वह सुपरचार्जर।', 'Exhaust gas spins the turbine wheel. A belt-driven unit is a supercharger.'] },

<script>
/* Turbocharger Lab — 3D model (Three.js r149). Shaft axis = X. Compressor at -X (cold), turbine at +X (hot).
   Cut section keeps the half with z <= 0, so the viewer at +z looks at the cut face. */
(function () {
  const TL = window.TL;
  const V3 = THREE.Vector3, PI = Math.PI, TAU = PI * 2;
  if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;
  const M = TL.M = { parts: {}, list: [] };

  function hatch(base) {
    const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, 32, 32); g.strokeStyle = 'rgba(0,0,0,.38)'; g.lineWidth = 2;
    for (let i = -32; i < 64; i += 8) { g.beginPath(); g.moveTo(i, 32); g.lineTo(i + 32, 0); g.stroke(); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(7, 7); t.encoding = THREE.sRGBEncoding; return t;
  }
  const mat = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, metalness: .45, roughness: .5, side: THREE.DoubleSide }, o));
  const capMat = (css) => new THREE.MeshStandardMaterial({ map: hatch(css), metalness: .1, roughness: .8, side: THREE.DoubleSide });

  /* closed profile [[r, a], ...] revolved round the X axis (or Y when axis === 'y'); cut = half + hatched caps */
  function lathe(profile, m, cm, cut, axis, smooth) {
    const g = new THREE.Group();
    const pts = profile.map(p => new THREE.Vector2(Math.max(p[0], 0.0001), p[1])); pts.push(pts[0].clone());
    let geo = new THREE.LatheGeometry(pts, cut ? 30 : 60, cut ? PI / 2 : 0, cut ? PI : TAU);
    if (!smooth) { geo = geo.toNonIndexed(); geo.computeVertexNormals(); }
    g.add(new THREE.Mesh(geo, m));

      <div class="row" style="margin:8px 0"><button class="btn" id="dPrev" ${st.step <= 0 ? 'disabled' : ''}>${t('prev')}</button><button class="btn pri" id="dNext" ${st.step >= n - 1 ? 'disabled' : ''}>${t('next')}</button><button class="btn" id="dAgain">${t('again')}</button><span class="muted">${st.step + 1} / ${n}</span></div>
      <ol class="steps">${TL.STEPS.map((s, i) => `<li data-step="${i}" class="${i === st.step ? 'cur' : (i < st.step ? 'done' : '')}"><b>${i + 1}. ${L(s.n)}</b><div class="d">${L(s.d)}<br><span class="tool">🧰 ${t('tool')}: ${L(s.t)}</span><br><span class="warn">⚠️ ${t('care')}: ${L(s.c)}</span></div></li>`).join('')}</ol>
      <div class="note green">${t('asm_note')}</div></div>`;
    const go = i => { st.step = clamp(i, 0, n - 1); rDis(); ping(); };
    $('#dPrev').onclick = () => go(st.step - 1); $('#dNext').onclick = () => go(st.step + 1); $('#dAgain').onclick = () => go(0);
    $$('[data-step]').forEach(li => { li.onclick = () => go(+li.dataset.step); });
  }

  /* system schematic */
  const SL = { filter: ['એર ફિલ્ટર', 'एयर फिल्टर', 'Air filter'], comp: ['કમ્પ્રેસર', 'कंप्रेसर', 'Compressor'], ic: ['ઇન્ટરકૂલર', 'इंटरकूलर', 'Intercooler'], engine: ['એન્જિન', 'इंजन', 'Engine'], turb: ['ટર્બાઇન', 'टर्बाइन', 'Turbine'], sil: ['સાયલેન્સર', 'साइलेंसर', 'Silencer'], sump: ['ઓઇલ સમ્પ', 'ऑयल संप', 'Oil sump'], rad: ['રેડિયેટર', 'रेडिएटर', 'Radiator'], chra: 'CHRA' };
  const sysOn = { air: true, exh: true, oil: true, cool: true }; let sysSel = null;
  function rSys() {
    const fl = (cls, col, d) => `<path class="flow" stroke="${col}" d="${d}"/><path class="flow d" d="${d}"/>`;
    const A = '#1f8fe0', E = '#e2452a', O = '#c98a00', C = '#12a594';
    const node = (id, inner, lx, ly, fill) => `<g class="node${sysSel === id ? ' sel' : ''}" data-node="${id}">${inner}<text x="${lx}" y="${ly}" text-anchor="middle" fill="${fill || '#13202c'}">${L(SL[id])}</text></g>`;
    $('#sysPage').innerHTML = `<h2>${t('sys_h')}</h2><p class="muted">${t('sys_p')}</p>
      <div class="row" style="margin:8px 0">${['air', 'exh', 'oil', 'cool'].map(k => `<button class="tb ${k}" data-lay="${k}" aria-pressed="${sysOn[k]}">${t('lay_' + k)}</button>`).join('')}</div>
      <div class="sysbox"><svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
        <g class="lay${sysOn.oil ? '' : ' off'}">${fl('', O, 'M500,330 V300')}${fl('', O, 'M470,180 H284 V217')}${fl('', O, 'M284,253 V306 H448 V355 H470')}<text x="372" y="174" font-size="11" fill="${O}" font-weight="700" text-anchor="middle">OIL FEED ▸</text><text x="386" y="322" font-size="11" fill="${O}" font-weight="700" text-anchor="middle">◂ OIL DRAIN</text></g>
        <g class="lay${sysOn.cool ? '' : ' off'}">${fl('', C, 'M470,208 H300 V217')}${fl('', C, 'M300,253 V283 H470')}${fl('', C, 'M630,170 H680')}${fl('', C, 'M680,280 H630')}<circle cx="655" cy="280" r="12" fill="#fff" stroke="${C}" stroke-width="3"/><text x="655" y="285" font-size="12" font-weight="700" text-anchor="middle" fill="${C}">P</text></g>
        <g class="lay${sysOn.air ? '' : ' off'}">${fl('', A, 'M95,110 V235 H192')}${fl('', '#7a5fe0', 'M230,197 V85 H300')}${fl('', A, 'M420,85 H520 V150')}<text x="246" y="140" font-size="11" fill="#7a5fe0" font-weight="700">150°C</text><text x="470" y="78" font-size="11" fill="${A}" font-weight="700" text-anchor="middle">50°C</text></g>
        <g class="lay${sysOn.exh ? '' : ' off'}">${fl('', E, 'M470,235 H388')}${fl('', '#b0634f', 'M350,273 V330 H150')}${fl('', '#b0634f', 'M40,330 H10')}<text x="430" y="228" font-size="11" fill="${E}" font-weight="700" text-anchor="middle">700°C</text></g>
        <rect x="268" y="230" width="44" height="10" fill="#566575"/>
        ${node('filter', '<rect x="30" y="60" width="130" height="50" rx="8" fill="#eaf5fb" stroke="' + A + '" stroke-width="2"/>', 95, 90)}
        ${node('ic', '<rect x="300" y="60" width="120" height="50" rx="8" fill="#eaf5fb" stroke="' + A + '" stroke-width="2"/><path d="M312 68v34M324 68v34M336 68v34M384 68v34M396 68v34M408 68v34" stroke="' + A + '" opacity=".35"/>', 360, 90)}
        ${node('engine', '<rect x="470" y="150" width="160" height="150" rx="10" fill="#e9edf1" stroke="#566575" stroke-width="2"/>', 550, 260)}
        ${node('sump', '<rect x="470" y="330" width="160" height="50" rx="8" fill="#fcefc7" stroke="' + O + '" stroke-width="2"/><circle cx="500" cy="315" r="12" fill="#fff" stroke="' + O + '" stroke-width="3"/>', 560, 361)}
        ${node('rad', '<rect x="680" y="150" width="62" height="150" rx="8" fill="#d5f3ee" stroke="' + C + '" stroke-width="2"/>', 711, 230)}
        ${node('sil', '<rect x="40" y="310" width="110" height="40" rx="18" fill="#f3e4df" stroke="#b0634f" stroke-width="2"/>', 95, 335)}
        ${node('comp', '<circle cx="230" cy="235" r="38" fill="#dceefb" stroke="' + A + '" stroke-width="3"/>', 230, 240)}
        ${node('turb', '<circle cx="350" cy="235" r="38" fill="#fde2dc" stroke="' + E + '" stroke-width="3"/>', 350, 240)}
        ${node('chra', '<rect x="266" y="217" width="48" height="36" rx="4" fill="#c9ced4" stroke="#566575" stroke-width="2"/>', 290, 240)}
        <text x="500" y="320" font-size="12" font-weight="700" text-anchor="middle" fill="${O}">P</text>
        <text x="550" y="176" font-size="11" text-anchor="middle" fill="#566575">INTAKE ▾</text><text x="496" y="230" font-size="11" fill="#566575">◂ EXH</text>
      </svg></div>
      <div class="card" style="margin-top:10px" id="sysInfo">${sysSel ? `<h3>${L(TL.SYS[sysSel][0])}</h3><p>${L(TL.SYS[sysSel][1])}</p>` : `<p class="muted">${t('sys_tap')}</p>`}</div>
      ${L(TL.SYS_NOTES)}`;
    $$('[data-lay]').forEach(b => { b.onclick = () => { sysOn[b.dataset.lay] = !sysOn[b.dataset.lay]; rSys(); }; });
    $$('[data-node]').forEach(g => { g.onclick = () => { sysSel = g.dataset.node; rSys(); ping(); }; });
  }

  /* failure lab */
  let dialVal = null, dialKind = null;
  function rFault() {
    const f = st.fault, hid = st.hidden;
    $('#faultSide').innerHTML = `<div class="card"><h3>${t('fault_h')}</h3><div class="flist"><button class="chip${!f ? ' on' : ''}" data-f="">${t('fault_none')}</button>${TL.FAULTS.map(x => `<button class="chip${f === x && !hid ? ' on' : ''}" data-f="${x.id}" ${hid ? 'disabled' : ''}>${L(x.n)}</button>`).join('')}</div></div>
      ${f && !hid ? `<div class="card"><h3>⚠️ ${L(f.n)}</h3><p><span class="tag">${t('f_cause')}</span>${L(f.c)}</p><p><span class="tag t-exh">${t('f_sym')}</span>${L(f.s)}</p><p><span class="tag t-oil">${t('f_see')}</span>${L(f.v)}</p><p><span class="tag t-cool">${t('f_fix')}</span>${L(f.f)}</p></div>` : ''}
      <div class="card"><h3>${t('quiz_h')}</h3><p class="muted">${t('quiz_p')}</p><button class="btn pri" id="qGo">${t('quiz_go')}</button><div id="qBox" style="margin-top:8px"></div></div>`;
    $$('[data-f]').forEach(b => { b.onclick = () => { st.fault = TL.FAULTS.find(x => x.id === b.dataset.f) || null; st.hidden = false; st.quiz = null; dialVal = null; if (st.fault) { if (st.thr < 60) setThr(70); if (st.fault.sim.coke || st.fault.sim.oilMul < .5) { st.oil = true; st.cut = true; syncTb(); } } rFault(); ping(); }; });
    $('#qGo').onclick = () => { const pool = TL.FAULTS.slice(), c = pool[Math.floor(Math.random() * pool.length)]; const opts = [c]; while (opts.length < 4) { const o = pool[Math.floor(Math.random() * pool.length)]; if (opts.indexOf(o) < 0) opts.push(o); } opts.sort(() => Math.random() - .5); st.fault = c; st.hidden = true; st.quiz = { c, opts, done: null }; dialVal = null; if (st.thr < 60) setThr(75); rFault(); ping(); };
    if (st.quiz) {
      const q = st.quiz;
      $('#qBox').innerHTML = `<p><span class="tag t-exh">${t('f_sym')}</span>${L(q.c.s)}</p><div class="q" style="padding:0;border:0"><div class="opts">${q.opts.map((o, i) => `<button data-qo="${i}" class="${q.done !== null ? (o === q.c ? 'right' : (i === q.done ? 'wrong' : '')) : ''}" ${q.done !== null ? 'disabled' : ''}>${L(o.n)}</button>`).join('')}</div></div>${q.done !== null ? `<p class="${q.opts[q.done] === q.c ? 'res-ok' : 'res-bad'}">${q.opts[q.done] === q.c ? t('quiz_ok') : t('quiz_no') + ' ' + L(q.c.n)}</p>` : ''}`;
      $$('[data-qo]').forEach(b => { b.onclick = () => { q.done = +b.dataset.qo; st.hidden = false; rFault(); ping(); }; });
    }
    const tc = t('test_cols'), lim = dialKind === 'ax' ? [.03, .10] : [.30, .60];
    const ok = dialVal !== null && dialVal >= lim[0] && dialVal <= lim[1];
    const ang = dialVal === null ? -150 : -150 + clamp(dialVal, 0, 1) * 300;
    let ticks = ''; for (let i = 0; i <= 10; i++) { const a = (-150 + i * 30 - 90) * PI / 180; ticks += `<line x1="${75 + 54 * Math.cos(a)}" y1="${75 + 54 * Math.sin(a)}" x2="${75 + 62 * Math.cos(a)}" y2="${75 + 62 * Math.sin(a)}" stroke="#13202c" stroke-width="2"/><text x="${75 + 44 * Math.cos(a)}" y="${79 + 44 * Math.sin(a)}" font-size="9" text-anchor="middle">${(i / 10).toFixed(1)}</text>`; }
    $('#faultPage').innerHTML = `<div class="card" style="margin-top:12px"><h3>${t('dial_h')}</h3><p class="muted">${t('dial_p')}</p>
      <div class="dial"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" fill="#fff" stroke="#13202c" stroke-width="4"/>${ticks}<text x="75" y="112" font-size="10" text-anchor="middle" fill="#566575">mm</text><line x1="75" y1="75" x2="75" y2="22" stroke="#d0261f" stroke-width="3" stroke-linecap="round" transform="rotate(${ang} 75 75)"/><circle cx="75" cy="75" r="5" fill="#13202c"/></svg>
      <div><div class="row"><button class="btn${dialKind === 'ax' ? ' pri' : ''}" data-dial="ax">${t('ax')}</button><button class="btn${dialKind === 'rad' ? ' pri' : ''}" data-dial="rad">${t('rad')}</button></div>
      ${dialVal !== null ? `<p style="font-size:20px;margin:10px 0 2px"><b>${dialVal.toFixed(2)} mm</b></p><p class="muted">${t('limit')}: ${lim[0].toFixed(2)} – ${lim[1].toFixed(2)} mm</p><p class="${ok ? 'res-ok' : 'res-bad'}">${ok ? t('ok') : t('notok')}</p>` : ''}</div></div></div>
      <div class="card" style="margin-top:12px"><h3>${t('test_h')}</h3><div class="tw"><table><tr>${tc.map(c => `<th>${c}</th>`).join('')}</tr>${TL.TESTS.map(r => `<tr><td><b>${L(r[0])}</b></td><td>${L(r[1])}</td><td>${L(r[2])}</td><td>${L(r[3])}</td></tr>`).join('')}</table></div></div>`;
    $$('[data-dial]').forEach(b => { b.onclick = () => { dialKind = b.dataset.dial; const fx = F(); dialVal = Math.max(.01, (dialKind === 'ax' ? fx.ax : fx.rad) + (Math.random() - .5) * .02); rFault(); ping(); }; });
  }

  function rTheory() {
    const open = $$('#theoryPage details').map(d => d.open);
    $('#theoryPage').innerHTML = `<h2 style="margin-bottom:10px">${t('th_h')}</h2>` + TL.THEORY.map((s, i) => `<details class="th" ${(open.length ? open[i] : i === 0) ? 'open' : ''}><summary>${L(s.h)}</summary><div>${L(s.b)}${s.fig ? `<div class="fig">${TL.figTurbo()}<div class="cap">${t('fig1')}</div><div class="legend">${TL.FIG_LEGEND.map((x, j) => `<span><b>${j + 1}</b> = ${L(x)}</span>`).join('')}</div></div>` : ''}${s.svg === 'vgt' ? `<div class="fig">${TL.figVGT(lang)}</div>` : ''}</div></details>`).join('');
    $$('#theoryPage details').forEach(d => d.addEventListener('toggle', ping));
  }

  const ans = {};
  function rMcq() {
    const done = Object.keys(ans).length, right = TL.MCQ.filter((q, i) => ans[i] === q.a).length;
    $('#mcqPage').innerHTML = `<h2 style="margin-bottom:10px">${t('mcq_h')} (${TL.MCQ.length})</h2><div class="score"><span>${t('score')}: ${right} / ${done} &nbsp;·&nbsp; ${done} / ${TL.MCQ.length}</span><button id="mReset">↺ ${t('reset')}</button></div>` +
      TL.MCQ.map((q, i) => `<div class="q">${q.fig ? `<div class="muted">${t('see_fig')}</div><div class="fig">${TL.figTurbo()}</div>` : ''}<div class="qt">${i + 1}. ${L(q.q)}</div><div class="opts">${q.o.map((o, j) => `<button data-q="${i}" data-o="${j}" class="${ans[i] !== undefined ? (j === q.a ? 'right' : (ans[i] === j ? 'wrong' : '')) : ''}" ${ans[i] !== undefined ? 'disabled' : ''}>${'ABCD'[j]}. ${L(o)}</button>`).join('')}</div>${ans[i] !== undefined ? `<div class="ex">${ans[i] === q.a ? '✅' : '❌'} ${L(q.e)}</div>` : ''}</div>`).join('');
    $$('[data-q]').forEach(b => { b.onclick = () => { const y = window.scrollY; ans[+b.dataset.q] = +b.dataset.o; rMcq(); window.scrollTo(0, y); ping(); }; });
    $('#mReset').onclick = () => { Object.keys(ans).forEach(k => delete ans[k]); rMcq(); };
  }

  /* ---------------- language / full screen / embed height ---------------- */
  const app = $('#app');
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement) || document.body.classList.contains('fsx');
  function fsLabel() { $('#fsBtn').textContent = t(isFs() ? 'fs_off' : 'fs_on'); }
  $('#fsBtn').onclick = () => {
    if (isFs()) { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); document.body.classList.remove('fsx'); fsLabel(); ping(); return; }
    const rq = app.requestFullscreen || app.webkitRequestFullscreen; const fb = () => { document.body.classList.add('fsx'); fsLabel(); };
    if (rq) { try { const r = rq.call(app); if (r && r.catch) r.catch(fb); } catch (e) { fb(); } } else fb();
    setTimeout(() => { if (!isFs()) fb(); fsLabel(); }, 350);
  };
  document.addEventListener('fullscreenchange', () => { fsLabel(); resize(); ping(); }); document.addEventListener('webkitfullscreenchange', () => { fsLabel(); resize(); });
  function setLang(i) {
    lang = i; try { localStorage.setItem('tl_lang', String(i)); } catch (e) { /* ignore */ }
    document.documentElement.lang = ['gu', 'hi', 'en'][i];
    $$('#langSeg button').forEach(b => b.setAttribute('aria-checked', +b.dataset.lang === i));
    $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    fsLabel(); buildTabs(); buildGauges(); Object.keys(lblEl).forEach(k => { lblEl[k].textContent = ''; });
    show(st.view); if (st.sel) select(st.sel); if (st.tour >= 0) tour(st.tour);
  }
  $$('#langSeg button').forEach(b => { b.onclick = () => setLang(+b.dataset.lang); });

  let lastH = 0;
  function ping() {
    if (window.parent === window) return;
    setTimeout(() => { if (isFs()) return; const ft = $('#foot'); const h = Math.ceil(ft.getBoundingClientRect().bottom + (window.scrollY || 0) + 8); if (Math.abs(h - lastH) > 4) { lastH = h; try { window.parent.postMessage({ dmHeight: h }, '*'); } catch (e) { /* ignore */ } } }, 60);
  }
  if (window.parent !== window) { window.addEventListener('load', ping); if (window.ResizeObserver) new ResizeObserver(ping).observe(app); document.addEventListener('click', ping); }

  /* ---------------- start ---------------- */
  const h0 = (location.hash || '').slice(1); if (TABS.indexOf(h0) >= 0) st.view = h0;
  window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (TABS.indexOf(h) >= 0 && h !== st.view) show(h); });
  setLang(lang); setThr(35); resize(); requestAnimationFrame(tick);
  TL.dbg = { st, S, orb, show, select, tour };
})();

</script>
</body>
</html>
