<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ટર્બોચાર્જર લેબ – 3D Turbocharger Lab (ગુજરાતી / हिन्दी / English)</title>
<meta name="description" content="Interactive 3D turbocharger lab for ITI trainees in Gujarati, Hindi and English: all parts, cut section, working animation, lubrication and cooling system, dismantling, failure lab, theory, materials and MCQ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/turbo.css">
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <g stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" fill="none">
        <path d="M20 20c0-6 3-9 7-10"/><path d="M20 20c5 3 6 7 5 11"/><path d="M20 20c-5 3-9 2-12-1"/>
      </g>
      <circle cx="20" cy="20" r="3" fill="currentColor"/>
    </svg>
    <div>
      <div class="brand-name" data-t="brand"></div>
      <div class="brand-sub" data-t="sub"></div>
    </div>
  </div>
  <div class="top-actions">
    <div class="seg" id="langSeg" role="radiogroup" aria-label="ભાષા / भाषा / Language">
      <button data-lang="0">ગુજ</button><button data-lang="1">हिं</button><button data-lang="2">EN</button>
    </div>
    <button class="fs-btn" id="fsBtn"></button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections"></nav>

<main>
  <section class="view" id="view-lab" hidden>
    <div class="bench">
      <div class="stage-slot" data-slot="lab"></div>
      <aside class="side" id="labSide"></aside>
    </div>
  </section>

  <section class="view" id="view-parts" hidden><div class="page" id="partsPage"></div></section>

  <section class="view" id="view-dis" hidden>
    <div class="bench">
      <div class="stage-slot" data-slot="dis"></div>
      <aside class="side" id="disSide"></aside>
    </div>
  </section>

  <section class="view" id="view-sys" hidden><div class="page" id="sysPage"></div></section>

  <section class="view" id="view-fault" hidden>
    <div class="bench">
      <div class="stage-slot" data-slot="fault"></div>
      <aside class="side" id="faultSide"></aside>
    </div>
    <div class="page" id="faultPage"></div>
  </section>

  <section class="view" id="view-theory" hidden><div class="page" id="theoryPage"></div></section>
  <section class="view" id="view-mcq" hidden><div class="page" id="mcqPage"></div></section>
</main>

<!-- shared 3D stage: moved into the active view -->
<div class="stage" id="stage">
  <div class="viewport" id="viewport">
    <div id="labels"></div>
    <div class="hint" id="hint"></div>
    <div class="alert" id="alert" hidden></div>
    <div class="pinfo" id="pinfo" hidden></div>
  </div>
  <div class="tour" id="tour" hidden>
    <div class="tour-txt" id="tourTxt"></div>
    <div class="tour-nav"><button id="tourPrev">◀</button><span id="tourNo"></span><button id="tourNext">▶</button><button id="tourEnd">✕</button></div>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div class="drive" id="drive">
    <label class="thr"><span id="thrLbl"></span><input type="range" id="thr" min="0" max="100" value="35"><b id="thrVal">35%</b></label>
    <div class="gauges" id="gauges"></div>
  </div>
</div>

<footer class="foot" id="foot">
  <div data-t="spec_note"></div>
  <div><b>ITI Lab Gujarati</b> · itilabgujarati.blogspot.com</div>
</footer>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/text.js"></script>
<script src="js/theory.js"></script>
<script src="js/model.js"></script>
<script src="js/app.js"></script>
</body>
</html>
